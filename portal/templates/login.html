<!doctype html><html><head><title>Mock Payer Portal - Login</title>
<style>body{font-family:sans-serif;max-width:420px;margin:60px auto}input,button{display:block;width:100%;margin:8px 0;padding:8px}.err{color:#b00}</style></head>
<body><h2>Mock Payer Portal</h2><p><i>Demo only - synthetic data</i></p>
{% if error %}<p class="err" id="error">{{ error }}</p>{% endif %}
<form method="post">
  <input id="username" name="username" placeholder="Username">
  <input id="password" name="password" type="password" placeholder="Password">
  <button id="login-btn" type="submit">Sign in</button>
</form></body></html>
